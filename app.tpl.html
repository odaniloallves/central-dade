<script>
/* ============ CONFIG ============ */
const SB = '__SB_URL__';
const KEY = '__SB_KEY__';
const LOGO_BLACK = document.querySelector('.lo-light').src;
const SESS = 'dade-central-sess';

/* ============ UTILIDADES ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate = s => s ? new Date(s).toLocaleDateString('pt-BR') : '';
const live = a => a.filter(x => !x.deleted_at);
const badge = ([c, t]) => `<span class="badge ${c}">${t}</span>`;
const ic = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${d}</svg>`;
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2400); }
function closeModal() { $('modal').classList.remove('open'); document.body.style.overflow = ''; }
function modal(h) { $('modalBox').innerHTML = h; $('modal').classList.add('open'); document.body.style.overflow = 'hidden'; const f = $('modalBox').querySelector('input,select,textarea'); if (f) f.focus(); }
const mhead = (t, s) => `<div class="modal-head"><div><h3>${t}</h3><p>${s}</p></div><button class="modal-close" data-a="close" type="button" aria-label="Fechar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`;
const head = (t, s, btn = '') => `<div class="page-header"><div><h1>${t}</h1><p>${s}</p></div>${btn}</div>`;
const table = (cols, rows, empty) => rows.length ? `<div class="table-wrapper"><table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td data-label="${i === r.length - 1 ? '' : cols[i]}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<div class="table-wrapper"><div class="empty-state"><p>${empty}</p></div></div>`;
const stat = (l, v, c = '') => `<div class="stat-card ${c}"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`;

/* ============ SESSÃO E BANCO ============ */
let sess = null;
try { sess = JSON.parse(localStorage.getItem(SESS) || 'null'); } catch (e) {}
function saveSess() { try { sess ? localStorage.setItem(SESS, JSON.stringify(sess)) : localStorage.removeItem(SESS); } catch (e) {} }
class AuthError extends Error {}
async function authCall(grant, body) {
  const r = await fetch(`${SB}/auth/v1/token?grant_type=${grant}`, { method:'POST', headers:{ apikey:KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) throw new AuthError(j.error_code || j.error || 'auth');
  sess = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email:(j.user && j.user.email) || (sess && sess.email) || '' };
  saveSess();
}
async function db(path, method = 'GET', body) {
  if (!sess) throw new AuthError('sem sessão');
  if (sess.expires_at - 60 < Date.now() / 1000) await authCall('refresh_token', { refresh_token:sess.refresh_token });
  const go = () => fetch(`${SB}/rest/v1/${path}`, { method, headers:{ apikey:KEY, Authorization:'Bearer ' + sess.access_token, 'Content-Type':'application/json', Prefer:'return=representation' }, body:body ? JSON.stringify(body) : undefined });
  let r = await go();
  if (r.status === 401) { await authCall('refresh_token', { refresh_token:sess.refresh_token }); r = await go(); }
  if (!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const S = { cli:[], bri:[], cop:[], pro:[], pre:[], cond:[], tar:[], pla:[], fec:[], imp:{ tipo:'percentual', valor:null } };
const addDias = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const hoje = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
async function loadAll() {
  await db(`central_propostas?status=eq.ativa&deleted_at=is.null&data_expiracao=lt.${hoje()}`, 'PATCH', { status:'expirada' });
  const [cli, bri, cop, pro, pre, cfg, tar, pla, fec, imp, met, avu, ent, pec, pco, pla2, ppin, pf] = await Promise.all([
    db('central_clientes?select=*&order=nome.asc'),
    db('central_briefings?select=*&order=created_at.desc'),
    db('central_copys?select=*&order=updated_at.desc'),
    db('central_propostas?select=*,servicos:central_proposta_servicos(*)&order=created_at.desc'),
    db('central_previas?select=*&order=created_at.desc'),
    db('central_config?select=*&chave=eq.condicoes'),
    db(`central_tarefas?select=*&or=(feita_em.is.null,data.gte.${addDias(hoje(), -45)})&order=data.asc,ordem.asc,created_at.asc`),
    db('central_planos?select=*&order=created_at.asc'),
    db('central_fechamentos?select=*&order=mes.desc'),
    db('central_config?select=*&chave=eq.imposto'),
    db('central_config?select=*&chave=eq.metas'),
    db('central_entradas?select=*&order=recebido_em.desc'),
    db('central_entregas?select=*&order=created_at.desc'),
    db('central_entrega_pecas?select=*&order=ordem.asc,created_at.asc'),
    db('central_pessoal_contas?select=*&order=created_at.asc'),
    db('central_pessoal_lanc?select=*&order=mes.desc'),
    db('central_config?select=*&chave=eq.pessoal_pin'),
    db('central_portfolio?select=*&deleted_at=is.null&order=ordem.asc,created_at.desc'),
  ]);
  S.pf = pf;
  S.pla = pla; S.fec = fec; S.imp = (imp[0] && imp[0].valor) || { tipo:'percentual', valor:null };
  S.metas = (met[0] && met[0].valor) || { padrao:null, meses:{} }; S.metasRow = !!met[0]; S.avu = avu; S.ent = ent; S.pec = pec; S.pco = pco; S.plc = pla2; S.pin = (ppin[0] && ppin[0].valor) || {}; S.pinRow = !!ppin[0];
  S.tar = tar;
  S.pre = pre; S.cond = (cfg[0] && cfg[0].valor && cfg[0].valor.itens) || [];
  pro.forEach(p => (p.servicos = p.servicos || []).sort((a, b) => a.ordem - b.ordem || a.id - b.id));
  S.cli = cli; S.bri = bri; S.cop = cop; S.pro = pro;
  await planosDasPropostas();
  limpaEntregas();
}
/* Entregas vencidas: apaga os arquivos e os registros (uma vez por sessão, sem travar a tela). */
let limpou = false;
async function limpaEntregas() {
  if (limpou) return; limpou = true;
  const venc = (S.ent || []).filter(e => e.expira_em < hoje()); if (!venc.length) return;
  try {
    const paths = S.pec.filter(x => venc.some(e => e.id === x.entrega_id)).map(x => x.path);
    if (paths.length) await fetch(`${SB}/storage/v1/object/central-entregas`, { method:'DELETE', headers:{ apikey:KEY, Authorization:'Bearer ' + sess.access_token, 'Content-Type':'application/json' }, body:JSON.stringify({ prefixes:paths }) });
    await db(`central_entregas?id=in.(${venc.map(e => e.id).join(',')})`, 'DELETE');
    S.ent = S.ent.filter(e => !venc.includes(e)); S.pec = S.pec.filter(x => !venc.some(e => e.id === x.entrega_id));
  } catch (e) { console.error(e); }
}
/* Proposta fechada com mensalidade vira um plano mensal, que o Financeiro acompanha mês a mês. */
async function planosDasPropostas() {
  const falta = live(S.pro).filter(p => p.status === 'fechada' && tot(p).m > 0 && !S.pla.some(x => String(x.proposta_id) === String(p.id)));
  if (!falta.length) return;
  try {
    const novos = await db('central_planos', 'POST', falta.map(p => ({ proposta_id:p.id, cliente_id:p.cliente_id || null, cliente_nome:p.cliente_nome, descricao:p.servicos.filter(s => conta(s) && s.cobranca === 'mensal').map(s => servNome(s.servico)).join(' + ') || 'Plano mensal', valor_base:tot(p).m, dia_cobranca:p.dia_cobranca || 10, inicio:(p.aprovada_em ? new Date(p.aprovada_em).toLocaleDateString('sv-SE', { timeZone:'America/Sao_Paulo' }) : hoje()).slice(0, 7) })));
    S.pla = [...S.pla, ...(novos || [])];
  } catch (e) { console.error(e); }
}
const TAB = { pf:'central_portfolio', pco:'central_pessoal_contas', plc:'central_pessoal_lanc', ent:'central_entregas', pec:'central_entrega_pecas', avu:'central_entradas', pla:'central_planos', fec:'central_fechamentos', tar:'central_tarefas', cli:'central_clientes', bri:'central_briefings', cop:'central_copys', pro:'central_propostas', pre:'central_previas' };
const patch = (k, id, body) => db(`${TAB[k]}?id=eq.${encodeURIComponent(id)}`, 'PATCH', body);

/* ============ DOMÍNIO ============ */
const TIPO = { lp:'Landing page', site:'Site institucional', identidade:'Identidade visual' };
const STB = { novo:['b-novo','Novo'], andamento:['b-and','Em andamento'], concluido:['b-ok','Concluído'] };
const STC = { rascunho:['b-and','Rascunho'], aprovada:['b-ok','Aprovada'] };
const cli = id => S.cli.find(c => c.id === id);
/* Mesmo cliente: mesmo CPF/CNPJ, mesmo e-mail ou mesmo nome (sem acento, maiúsculas, espaços e pontuação). */
const normNome = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const soDig = t => String(t || '').replace(/\D/g, '');
function acharCli({ documento, email, nome } = {}, fora) {
  const d = soDig(documento), e = String(email || '').trim().toLowerCase(), n = normNome(nome), lista = live(S.cli).filter(c => c.id !== fora);
  return (d && lista.find(c => soDig(c.documento) === d)) || (e && lista.find(c => String(c.email || '').trim().toLowerCase() === e)) || (n && lista.find(c => normNome(c.nome) === n)) || null;
}
const briNome = b => { const c = b.cliente_id && cli(b.cliente_id); return c ? c.nome : b.empresa; };
const copNome = c => { const k = c.cliente_id && cli(c.cliente_id); if (k) return k.nome; const b = S.bri.find(b => b.id === c.briefing_id); return b ? briNome(b) : 'Sem cliente'; };
const dadosBri = b => ({ contato:b.responsavel || null, email:b.email || null, whatsapp:b.whatsapp || null, razao_social:b.razao_social || null, documento:b.documento || null, telefone:b.telefone || null, endereco:b.endereco || null });
const formUrl = k => new URL(k, location.href.split('#')[0]).href;
const etapas = b => (b.respostas && Array.isArray(b.respostas.etapas)) ? b.respostas.etapas : [];
const dobras = c => Array.isArray(c.dobras) ? c.dobras : [];
const STP = { ativa:['badge-ativa','Ativa'], expirada:['badge-expirada','Expirada'], fechada:['badge-fechada','Concluída'], perdida:['badge-perdida','Perdida'] };
const CAT = window.DADE_SERVICOS, money = window.dadeMoney, servNome = window.dadeServNome;
const conta = s => !s.opcional || s.aceito === true;
const tot = p => { let m = 0, u = 0; (p.servicos || []).filter(conta).forEach(s => s.cobranca === 'mensal' ? m += +s.valor : u += +s.valor); return { m, u }; };
const STV = { aguardando:['b-and','Aguardando cliente'], aprovada:['b-ok','Aprovada'], ajustes:['b-warn','Ajustes pedidos'] };
const previaUrl = v => new URL('v?' + encodeURIComponent(v.token), location.href.split('#')[0]).href;
const imgUrl = path => `${SB}/storage/v1/object/public/central-previas/${path.split('/').map(encodeURIComponent).join('/')}`;
const preNome = v => { const c = v.cliente_id && cli(v.cliente_id); return c ? c.nome : 'Sem cliente'; };
const fdoc = d => { d = String(d || ''); return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : d.length === 14 ? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5') : d; };
const valorHtml = p => { const { m, u } = tot(p); return (m ? money(m) + '<span style="color:var(--text-muted);font-size:12px">/mês</span>' : '') + (m && u ? '<br>' : '') + (u ? money(u) : '') || '—'; };
const propUrl = slug => new URL('p?' + encodeURIComponent(slug), location.href.split('#')[0]).href;
const dmy = d => d ? d.slice(0, 10).split('-').reverse().join('/') : '';
const soma = (lista, cob) => lista.reduce((a, p) => a + (cob ? tot(p)[cob] : tot(p).m + tot(p).u), 0);
const numProp = p => String(p.id).padStart(4, '0');
const half = v => Math.round(v * 50) / 100;
const FORMA = { pix:'Pix', cartao:'Cartão de crédito' };
/* Situação do pagamento do projeto (valor único). Pix: 50% na entrada e 50% na entrega. */
function situacaoPag(p) {
  const u = tot(p).u; if (!u || p.status !== 'fechada') return null;
  if (p.forma_pagamento === 'pix') {
    if (p.pago_entrada_em && p.pago_final_em) return { ok:true, t:'Pago 100%', d:money(u) };
    if (p.pago_entrada_em) return { meio:true, t:'Entrada de 50% paga', d:`falta ${money(u - half(u))} na entrega` };
    return { t:'Aguardando entrada de 50%', d:money(half(u)) };
  }
  return p.pago_entrada_em ? { ok:true, t:'Pago 100%', d:money(u) } : { t:'Aguardando pagamento', d:money(u) };
}
const pagTag = p => { const x = situacaoPag(p); return x ? `<span style="display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:${x.ok ? 'var(--lime)' : x.meio ? 'var(--amber)' : 'var(--text-muted)'}">${x.t}${x.ok ? '' : ' · ' + x.d}</span>` : ''; };
/* ---- linha do tempo do projeto ---- */
const ETAPAS = {
  identidade_visual:['Briefing e imersão', 'Pesquisa e conceito', 'Criação da marca', 'Apresentação da prévia', 'Ajustes', 'Manual da marca e arquivos finais', 'Entrega'],
  site_institucional:['Briefing e conteúdo', 'Estrutura das páginas', 'Design das telas', 'Aprovação do layout', 'Desenvolvimento', 'Revisão e ajustes', 'Publicação'],
  landing_page:['Briefing e copy', 'Design da página', 'Aprovação do layout', 'Desenvolvimento e integrações', 'Revisão e ajustes', 'Publicação'],
  apresentacao:['Briefing e conteúdo', 'Estrutura e narrativa', 'Design dos slides', 'Revisão e ajustes', 'Entrega'],
  motion:['Briefing', 'Roteiro e storyboard', 'Animação', 'Revisão e ajustes', 'Entrega'],
  captacao_video:['Planejamento e roteiro', 'Gravação', 'Organização e entrega dos arquivos'],
  edicao_video:['Recebimento do material', 'Edição', 'Revisão e ajustes', 'Entrega'],
  captacao_edicao_video:['Planejamento e roteiro', 'Gravação', 'Edição', 'Revisão e ajustes', 'Entrega'],
  criativos_social:['Briefing do mês', 'Criação', 'Aprovação', 'Entrega'],
  prototipo_app:['Briefing', 'Fluxos e wireframes', 'Design das telas', 'Protótipo navegável', 'Revisão e ajustes', 'Entrega'],
  materiais_impressos:['Briefing', 'Criação das peças', 'Aprovação', 'Fechamento de arquivo para a gráfica', 'Entrega'],
  pecas_digitais:['Briefing', 'Criação', 'Aprovação', 'Entrega'],
  automacao:['Mapeamento do processo', 'Configuração', 'Testes', 'Entrega e orientação'],
};
const ETAPAS_PADRAO = ['Briefing', 'Criação', 'Prévia', 'Ajustes', 'Entrega'];
function linhaSugerida(p) {

  btn.disabled = false; btn.textContent = 'Entrar';
});
